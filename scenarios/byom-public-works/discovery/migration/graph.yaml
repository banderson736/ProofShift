version: 1
nodes:
  source-assets:
    type: source
    system: source
    storage: records
    semanticType: PublicWorks.Asset
    selector:
      kind: table
      properties:
        name: dbo.assets
        columns: asset_id,asset_name,asset_type,active
      identity: [asset_id]
  source-work-orders:
    type: source
    system: source
    storage: records
    semanticType: PublicWorks.WorkOrder
    selector:
      kind: table
      properties:
        name: dbo.work_orders
        columns: work_order_id,asset_id,status,created_at,description
      identity: [work_order_id]
  source-history:
    type: source
    system: source
    storage: records
    semanticType: PublicWorks.WorkOrderHistory
    selector:
      kind: table
      properties:
        name: dbo.work_order_history
        columns: history_id,work_order_id,status,changed_at,note
      identity: [history_id]
  target-assets:
    type: target
    system: target
    storage: records
    semanticType: PublicWorks.Asset
    selector:
      kind: table
      properties:
        name: public.assets
        columns: asset_id,asset_name,asset_type,active
      identity: [asset_id]
  target-work-orders:
    type: target
    system: target
    storage: records
    semanticType: PublicWorks.WorkOrder
    selector:
      kind: table
      properties:
        name: public.work_orders
        columns: work_order_id,asset_id,status,created_at,description
      identity: [work_order_id]
  target-history:
    type: target
    system: target
    storage: records
    semanticType: PublicWorks.WorkOrderHistory
    selector:
      kind: table
      properties:
        name: public.work_order_history
        columns: history_id,work_order_id,status,changed_at,note
      identity: [history_id]
edges:
  assets:
    from: [source-assets]
    to: [target-assets]
    operation:
      type: copy
    recovery:
      mode: restore
      requiresSnapshot: true
  work-orders:
    from: [source-work-orders]
    to: [target-work-orders]
    operation:
      type: copy
    recovery:
      mode: restore
      requiresSnapshot: true
  history:
    from: [source-history]
    to: [target-history]
    operation:
      type: copy
    recovery:
      mode: restore
      requiresSnapshot: true
