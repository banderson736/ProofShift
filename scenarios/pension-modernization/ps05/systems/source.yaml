id: legacy-pension
name: Synthetic Legacy Pension
role: source
storage:
  member-database:
    connector: sqlserver
    connection:
      secret: PS05_SQL_CONNECTION
    checkpoint:
      consistency: transaction-consistent
      isolation: serializable
  member-documents:
    connector: files
    root:
      env: PS05_SOURCE_FILES
  supplemental-members:
    connector: csv
    root:
      env: PS05_SOURCE_CSV
    delimiter: ";"