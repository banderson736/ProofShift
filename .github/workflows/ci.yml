name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ProofShift.sln
      - name: Build
        run: dotnet build ProofShift.sln --no-restore
      - name: Test
        run: dotnet test --solution ProofShift.sln --no-restore