version: 1
nodes:
  source:
    type: source
    system: legacy
    storage: member-store
    semanticType: Generic.Record
    selector: { kind: table, properties: { name: source }, identity: [id] }
  target:
    type: target
    system: modern
    storage: participant-store
    semanticType: Generic.Record
    selector: { kind: table, properties: { name: target }, identity: [id] }
edges:
  forward:
    from: [source]
    to: [target]
    operation: { type: transform, fields: { id: { source: SOURCE_ID } } }
    recovery: { mode: reverse }
  backward:
    from: [target]
    to: [source]
    operation: { type: transform, fields: { id: { source: TARGET_ID } } }
    recovery: { mode: reverse }
